<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 520" role="img" aria-labelledby="title desc">
  <title id="title">TrimPath research vial</title>
  <desc id="desc">Clear research vial labeled Trim in black and Path in blue</desc>
  <defs>
    <linearGradient id="glass" x1="0" x2="1"><stop stop-color="#dbe8f2" stop-opacity=".42"/><stop offset=".24" stop-color="#fff" stop-opacity=".9"/><stop offset=".7" stop-color="#eef8ff" stop-opacity=".54"/><stop offset="1" stop-color="#a6bed0" stop-opacity=".5"/></linearGradient>
    <linearGradient id="cap" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#1b2028"/><stop offset="1" stop-color="#020408"/></linearGradient>
    <filter id="shadow" x="-30%" y="-20%" width="160%" height="150%"><feDropShadow dx="0" dy="18" stdDeviation="14" flood-color="#07182d" flood-opacity=".2"/></filter>
  </defs>
  <g filter="url(#shadow)">
    <rect x="70" y="27" width="160" height="54" rx="13" fill="url(#cap)"/>
    <path d="M84 70h132v29c0 8-7 15-15 15H99c-8 0-15-7-15-15V70Z" fill="#0b0e13"/>
    <rect x="92" y="102" width="116" height="35" rx="10" fill="url(#glass)" stroke="#9fb3c2" stroke-width="3"/>
    <path d="M66 151c0-17 14-31 31-31h106c17 0 31 14 31 31l10 312c1 20-15 36-35 36H91c-20 0-36-16-35-36l10-312Z" fill="url(#glass)" stroke="#9fb3c2" stroke-width="4"/>
    <rect x="65" y="190" width="170" height="232" rx="8" fill="#fff" stroke="#e4e9ee"/>
    <rect x="65" y="190" width="170" height="10" rx="5" fill="#1476e8"/>
    <text x="150" y="250" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="30" letter-spacing="-1"><tspan fill="#070b12">TRIM</tspan><tspan fill="#1476e8">PATH</tspan></text>
    <path d="M92 271h116" stroke="#1476e8" stroke-width="2"/>
    <text x="150" y="306" text-anchor="middle" fill="#0a111c" font-family="Arial, Helvetica, sans-serif" font-weight="800" font-size="13" letter-spacing="1.6">RESEARCH COMPOUND</text>
    <text x="150" y="350" text-anchor="middle" fill="#1476e8" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="21">LABELED BY LOT</text>
    <text x="150" y="395" text-anchor="middle" fill="#2f3a48" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="10" letter-spacing="1.2">RESEARCH USE ONLY</text>
    <path d="M65 421h170v18c0 7-6 13-13 13H78c-7 0-13-6-13-13v-18Z" fill="#1476e8"/>
